# model params
num_layers: 4
num_heads: 8
model_dim: 64
hidden_dim: 128
decoder_hidden_dim: 128
dropout: 0.0
sample_k: 20
aggregation: 'avg'
function_type: 2
hyper_scales: [1, 'adaptive']

# input/output params
dataset: carla
past_length: 30
future_length: 50
inputs: ['pos_x', 'pos_y']
pred_rel: True
scale: 1
data_dir: datasets/carla/

# training params
seed: 1
num_epochs: 100
lr: 0.0001
clip_grad: null
batch_size: 1
scheduler_type: MultiStepLR
milestones: [50, 80]
decay_gamma: 0.5

best_loss_weight: 1
diverse_loss_weight: 1

minmax_params:
  x_min: 0
  x_max: 420
  y_min: 16
  y_max: 42